<app-header></app-header>

<main style="min-height: 80vh;">
  <router-outlet></router-outlet>
</main>

<div class="chat-launcher" (click)="toggleChat()">
  <span *ngIf="!chatAbierto">💬</span>
  <span *ngIf="chatAbierto">✕</span>
</div>

<div class="chat-window" [class.active]="chatAbierto">
  <div class="chat-header">
    <h3>Asistente La Tavola</h3>
    <p>¿En qué puedo ayudarte hoy?</p>
  </div>
  <div class="chat-body">
    <div class="message bot">Hola! Soy tu asistente. ¿Quieres que te recomiende algún plato de nuestra carta? 🍝</div>
  </div>
  <div class="chat-footer">
    <input type="text" placeholder="Escribe tu duda...">
    <button>Enviar</button>
  </div>
</div>
