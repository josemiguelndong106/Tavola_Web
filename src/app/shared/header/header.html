<header class="main-header" [class.scrolled]="scrolled">

  <a routerLink="/" class="logo">
    <div class="logo-icon">LT</div>
    <span class="logo-text">LA TAVOLA</span>
  </a>

  <div class="header-actions">
    <button class="lang-toggle" (click)="toggleLang()">{{ lang === 'es' ? 'EN' : 'ES' }}</button>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="nav-links" [class.open]="menuOpen">
    <ul>
      <li><a routerLink="/home" routerLinkActive="active" (click)="menuOpen = false">{{ 'header.home' | translate }}</a></li>
      <li><a routerLink="/menu" routerLinkActive="active" (click)="menuOpen = false">{{ 'header.menu' | translate }}</a></li>
      <li><a routerLink="/reservas" routerLinkActive="active" class="reserva-link" (click)="menuOpen = false">
          {{ 'header.reservations' | translate }} <span class="cart-badge" *ngIf="(cartService.cart$ | async)?.length">
      {{ (cartService.cart$ | async)?.length }}
    </span></a>
      </li>
      <li><a routerLink="/nosotros" routerLinkActive="active" (click)="menuOpen = false">{{ 'header.about' | translate }}</a></li>
      <li><a routerLink="/contacto" routerLinkActive="active" (click)="menuOpen = false">{{ 'header.contact' | translate }}</a></li>
    </ul>
  </nav>

</header>
